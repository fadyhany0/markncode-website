<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Single Page Apps for GitHub Pages Route Restore -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="MarknCode Agency - Digital Marketing & UI/UX Services"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Enterprise Security Headers & Policies -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Early Anti-Inspect & Framebusting Script -->
    <script>
      (function() {
        // Framebusting (Anti-Clickjacking)
        if (window.top !== window.self) {
          try {
            window.top.location = window.self.location;
          } catch(e) {
            document.documentElement.style.display = 'none';
          }
        }
        // Early Right-click Block
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        }, true);
        // Early Keydown Block (F12, Ctrl+Shift+I/J/C, Ctrl+U)
        document.addEventListener('keydown', function(e) {
          var isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
          var ctrl = isMac ? e.metaKey : e.ctrlKey;
          var k = e.key ? e.key.toUpperCase() : '';
          var code = e.keyCode || e.which;
          if (k === 'F12' || code === 123 ||
             (ctrl && e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || code === 73 || code === 74 || code === 67)) ||
             (ctrl && (k === 'U' || k === 'S' || code === 85 || code === 83))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
    <title>MarknCode Agency | Premium Digital Marketing & AI Solutions</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
